name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 运行测试
      env:
        OPENAI_API_KEY: dummy-ci-key-not-real
      run: |
        pytest tests/ -v --cov=api --cov=db --cov=utils --cov-report=xml

    - name: 上传测试覆盖率
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 门控 job：在 step 内读取 secret，输出布尔值供后续 job 的 if 使用
  # （GitHub Actions 不允许在 job 级 if 表达式中直接引用 secrets 上下文）
  check-secrets:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      has-docker: ${{ steps.set.outputs.has-docker }}
      has-server: ${{ steps.set.outputs.has-server }}
    steps:
      - id: set
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "has-docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-docker=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "has-server=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-server=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [test, check-secrets]
    if: needs.check-secrets.outputs.has-docker == 'true'

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 构建并标记Docker镜像
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/ctrip-assistant:${{ github.sha }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/ctrip-assistant:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/ctrip-assistant:latest

    - name: 登录Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 推送Docker镜像
      if: github.event_name != 'pull_request'
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ctrip-assistant:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/ctrip-assistant:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-secrets.outputs.has-server == 'true'

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 部署到服务器
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /app/ctrip-assistant
          docker-compose pull
          docker-compose up -d
          docker system prune -f
