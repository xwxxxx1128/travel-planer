services:
  backend:
    build: .
    container_name: ctrip_backend
    # 仅 Docker 内网暴露，不映射到宿主机公网端口；统一由前端 3000 的 nginx 反代访问
    expose:
      - '8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/system.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - .:/app
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: ctrip_chroma
    # 仅内网互通，不暴露公网端口
    expose:
      - '8000'
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # 注意：原 postgres 服务已移除。项目默认使用 sqlite（见 DATABASE_URL），
  # 由 backend 的 volumes 持久化到宿主机 system.db，2G 内存机器更省资源。
  # 若日后需切换 postgres，请单独引入并仅 expose 内网端口，切勿映射 5432 到公网。

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 高德 JS API Key 是前端公开使用的，构建期注入（Vite 仅在构建时可见）
      args:
        - VITE_AMAP_JS_API_KEY=${VITE_AMAP_JS_API_KEY}

    container_name: ctrip_frontend
    ports:
      # 公网只暴露这一个端口；nginx 内部把 /api 透传到 backend:8000
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
