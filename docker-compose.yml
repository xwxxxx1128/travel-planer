version: '3.9'
services:
  backend:
    build: .
    container_name: ctrip_backend
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/system.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - .:/app
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: ctrip_chroma
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ctrip_postgres
    environment:
      POSTGRES_DB: ctrip
      POSTGRES_USER: ctrip
      POSTGRES_PASSWORD: ctrip
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ctrip_frontend
    ports:
      - '3000:3000'
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  chroma_data:
