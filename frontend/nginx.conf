server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端：未知路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：透传完整路径（含 /api 前缀）到 backend:8000
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式支持：关闭代理缓冲，否则 /chat/stream 的事件会被攒批后一次性下发
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        # 流式对话可能长时间无新字节（模型思考中），放宽读写超时避免被 nginx 默认 60s 掐断，
        # 否则前端会“一直思考到超时”，而答案其实已算完（刷新后才出现）。
        # 此处需大于后端 _STREAM_BUDGET（480s），给复杂多步任务（酒店/行程）留出余量。
        proxy_read_timeout 540s;
        proxy_send_timeout 540s;
    }

    # FastAPI 文档与根接口（便于在 3000 端口一并访问）
    location = /health {
        proxy_pass http://backend:8000;
    }
    location /docs {
        proxy_pass http://backend:8000;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
