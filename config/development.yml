LOG_LEVEL: INFO
HOST: 127.0.0.1
PORT: 8000
ORIGINS: ['http://localhost:8080', 'http://127.0.0.1:8080']
DATABASE:
  DRIVER: sqlite
  NAME: ./system.db

# JWT_SECRET_KEY / ACCESS_TOKEN_EXPIRE_MINUTES 已迁移到根 .env（app.core.config.SECRET_KEY）；
# 保留 ALGORITHM 供未迁移的旧工具读取。
ALGORITHM: HS256

WHITE_LIST: ['^/$', '^/favicon\.ico$', '/api/login', '/api/register', '/static', '/docs', '/swagger', '/openapi', '/api/auth']

DEFAULT_PASSWORD: 123123
